<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Naija Cuisines</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #FFF3E0;
            color: #333333;
        }

        header {
            background-color: #E85D04;
            color: white;
            padding: 30px;
            text-align: center;
        }

        main {
            text-align: center;
            padding: 50px;
        }

        .welcome-box {
            background-color: white;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #E85D04;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .button:hover {
            background-color: #c94f03;
        }
    </style>
</head>

<body>

<header>
    <h1>Naija Cuisines</h1>
    <p>Food Ordering and Catering System</p>
</header>

<main>
    <div class="welcome-box">
        <h2>Welcome to Naija Cuisines</h2>

        <p>
            Order your favourite Nigerian meals for pickup or delivery.
        </p>

        <a href="#" class="button">Place an Order</a>
    </div>
</main>

</body>
</html>
